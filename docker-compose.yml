services:
  unlimited-ocr:
    image: docker.io/vllm/vllm-openai:unlimited-ocr
    container_name: unlimited-ocr
    ports:
      - "8000:8000"
    ipc: host
    # podman-compose ignores shorthand `gpus: all`; use deploy.devices (CDI)
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]
    environment:
      # Optional: set HF_TOKEN if Hugging Face rate-limits anonymous downloads
      HF_TOKEN: ${HF_TOKEN:-}
      HUGGING_FACE_HUB_TOKEN: ${HF_TOKEN:-}
    volumes:
      - huggingface-cache:/root/.cache/huggingface
      - ./inputs:/inputs:ro
      - ./outputs:/outputs
    command:
      - baidu/Unlimited-OCR
      - --trust-remote-code
      - --logits_processors
      - vllm.model_executor.models.unlimited_ocr:NGramPerReqLogitsProcessor
      - --no-enable-prefix-caching
      - --mm-processor-cache-gb
      - "0"
      # RTX 5080 16 GB + desktop (~2GB+): 0.85 OOMs when free < ~13.2 GiB; keep 0.75 for headroom.
      - --gpu-memory-utilization
      - "0.75"
      - --max-model-len
      - "16384"
      - --host
      - "0.0.0.0"
      - --port
      - "8000"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://127.0.0.1:8000/health"]
      interval: 10s
      timeout: 5s
      retries: 60
      start_period: 120s
    restart: unless-stopped

  ui:
    build: ./ui
    container_name: unlimited-ocr-ui
    ports:
      - "7860:7860"
    # CDI GPU so nvidia-smi works for /api/gpu (UI image has no driver libs otherwise)
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]
    environment:
      OCR_API_BASE: http://unlimited-ocr:8000/v1
      OCR_MODEL: baidu/Unlimited-OCR
      # UI token policy for RTX 5080 16 GB (never request max_tokens == max-model-len)
      OCR_MAX_MODEL_LEN: "16384"
      OCR_RESERVED_INPUT_TOKENS: "4096"
      OCR_MAX_TOKENS: "8192"
    depends_on:
      unlimited-ocr:
        condition: service_healthy
    restart: unless-stopped

volumes:
  huggingface-cache:
